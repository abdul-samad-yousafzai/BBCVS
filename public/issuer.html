<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Generate, issue, or revoke a student certificate.">
    <title>Issuer Portal</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f2f5f9;
      }

      body {
        box-sizing: border-box;
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      a { color: #1f4e79; }

      .panel,
      .result-card {
        margin-top: 24px;
        padding: 24px;
        border: 1px solid #dce3ec;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 4px 16px rgb(23 32 51 / 5%);
      }

      label {
        display: block;
        margin: 16px 0 7px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #aeb9c8;
        border-radius: 7px;
        font: inherit;
      }

      button {
        margin-top: 20px;
        padding: 10px 16px;
        border: 0;
        border-radius: 7px;
        color: #fff;
        background: #1f4e79;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      #revoke-form button { background: #a12222; }
      button:disabled { opacity: 0.65; cursor: wait; }
      .result-card[hidden] { display: none; }
      .result-card p {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .result-card.error { border-left: 6px solid #c62828; }
      .result-card.success { border-left: 6px solid #16803c; }
    </style>
    <script src="/issuer.js" defer></script>
  </head>
  <body>
    <main>
      <p><a href="/">Certificate verification</a></p>
      <h1>Issuer Portal</h1>
      <p>Create a certificate PDF and issue its hash, or revoke a previously issued hash.</p>

      <section class="panel" aria-labelledby="issue-heading">
        <h2 id="issue-heading">Generate and issue certificate</h2>
        <form id="issue-form">
          <label for="student-name">Student name</label>
          <input id="student-name" name="studentName" autocomplete="name" required>

          <label for="roll-number">Roll number</label>
          <input id="roll-number" name="rollNumber" required>

          <label for="program">Program</label>
          <input id="program" name="program" required>

          <label for="issue-date">Issue date</label>
          <input id="issue-date" name="issueDate" type="date" required>

          <label for="verification-url">Verification URL</label>
          <input
            id="verification-url"
            name="verificationUrl"
            type="url"
            placeholder="https://example.edu/verify"
            required
          >
          <button type="submit">Generate and issue</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="revoke-heading">
        <h2 id="revoke-heading">Revoke certificate</h2>
        <form id="revoke-form">
          <label for="revoke-hash">Certificate hash</label>
          <input
            id="revoke-hash"
            name="hash"
            type="text"
            pattern="0x[0-9a-fA-F]{64}"
            placeholder="0x followed by 64 hexadecimal characters"
            required
          >
          <button type="submit">Revoke certificate</button>
        </form>
      </section>

      <section id="issuer-result" class="result-card" aria-live="polite" hidden>
        <h2 id="issuer-result-title"></h2>
        <p id="issuer-result-message"></p>
      </section>
    </main>
  </body>
</html>
