<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Verify an issued certificate by PDF or SHA-256 hash.">
    <title>Certificate Verification</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f2f5f9;
      }

      body {
        box-sizing: border-box;
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      h1 {
        margin-bottom: 8px;
      }

      .intro {
        margin-top: 0;
        color: #536176;
      }

      .panel,
      .result-card {
        margin-top: 24px;
        padding: 24px;
        border: 1px solid #dce3ec;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 4px 16px rgb(23 32 51 / 5%);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        margin-bottom: 16px;
        padding: 11px 12px;
        border: 1px solid #aeb9c8;
        border-radius: 7px;
        font: inherit;
      }

      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 7px;
        color: #fff;
        background: #1f4e79;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .result-card[hidden] {
        display: none;
      }

      .result-card {
        border-left: 6px solid #8a94a3;
      }

      .result-card.valid {
        border-left-color: #16803c;
        background: #f0fbf3;
      }

      .result-card.revoked {
        border-left-color: #c62828;
        background: #fff3f2;
      }

      .result-card.not-found {
        border-left-color: #7a8492;
        background: #f6f7f9;
      }

      .result-card.error {
        border-left-color: #c62828;
        background: #fff3f2;
      }

      .result-card h2 {
        margin-top: 0;
      }

      .result-card p {
        overflow-wrap: anywhere;
      }

      .error-message {
        color: #9c1c1c;
      }
    </style>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Certificate Verification</h1>
      <p class="intro">Check an issued certificate using its PDF file or certificate hash.</p>
      <p><a href="/issuer">Issuer portal</a></p>

      <section class="panel" aria-labelledby="file-heading">
        <h2 id="file-heading">Verify by file</h2>
        <form id="file-form">
          <label for="pdf-file">Certificate PDF</label>
          <input id="pdf-file" name="file" type="file" accept="application/pdf,.pdf" required>
          <button type="submit">Verify PDF</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="hash-heading">
        <h2 id="hash-heading">Verify by hash</h2>
        <form id="hash-form">
          <label for="certificate-hash">Certificate hash</label>
          <input
            id="certificate-hash"
            name="hash"
            type="text"
            placeholder="0x followed by 64 hexadecimal characters"
            pattern="0x[0-9a-fA-F]{64}"
            autocomplete="off"
            required
          >
          <button type="submit">Verify hash</button>
        </form>
      </section>

      <section id="result-card" class="result-card" aria-live="polite" hidden>
        <h2 id="result-status"></h2>
        <p id="result-issuer"></p>
        <p id="result-date"></p>
        <p id="result-error" class="error-message" hidden></p>
      </section>
    </main>
  </body>
</html>
